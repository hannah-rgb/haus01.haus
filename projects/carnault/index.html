<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carnault — Brand Identity — 01 Studio</title>

  <link rel="stylesheet" href="/styles/site.css" />
  <link rel="stylesheet" href="/styles/project.css" />
</head>
<body>
  <main class="project" id="project"></main>

  <script src="/scripts/project.js"></script>
  <script>
    renderProject({
      name: "Carnault",
      category: "Brand Identity",
      year: "2026",

      info: {
    intro:
        "CARNAULT is a Luxury E-cigarette brand that aims to deliver a sophisticated indulgence in modern rituals.",

    sections: [
        {
            label: "The Brief",
            text: "CARNAULT needed a rebranding as they pivoted their target from traditional Swiss wealthy groups of people to younger, international and active professionals."
        },
        {
            label: "Solution",
            text: "Overall concept was to keep it simple and to emphasize the product while maintaining Swiss luxury and technology as brand essence. So the logo was redrawned based on Akkurat from Lineto, in a neutral, slightly technical way."
        }
    ]
},

      // Every block is just a grid span now (4 / 6 / 12) — no exact
      // px positions. Replace every src with the real assets.
      blocks: [
        { type: "video", span: 12, src: "/assets/carnault/carnault-3d-artwork.webp", alt: "Carnault — product hero" },

        // two span-6 blocks in a row = a side-by-side pair
        { type: "image", span: 6, src: "/assets/carnault/package.png", alt: "Carnault starter set poster" },
        { type: "image", span: 6, src: "/assets/carnault/logo.png", alt: "Carnault wordmark" },

        // room/monitor photo with the screen content composited on top —
        // left/top/width/height are now % of this block, not raw px
        {
          type: "composite",
          span: 12,
          base: { src: "/assets/carnault/pitch-deck.png", alt: "Carnault website mockup on a monitor" },
        },
{ type: "img", span: 6, src: "/assets/empty.png", alt: "placeholder" },
     { type: "image", span: 6, src: "/assets/carnault/identity.png", alt: "Carnault starter set poster" },
        { type: "image", span: 12, src: "/assets/carnault/door.png", alt: "Carnault business card mockup" },
                // two span-6 blocks in a row = a side-by-side pair
    
      ],

      footerNote: "Participants in order of contribution | Grace Hannah Park, Sarah Heitz, Taltal Levi, Misha Buksha, and Tobias Kaiser",
      footerLinks: [
        // { label: "About", href: "/#about" },
        { label: "Full portfolio on request", href: "mailto:hannahpark.work@gmail.com" }
      ]
    });

    
  </script>
</body>
</html>
