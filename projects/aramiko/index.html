  <script>
    renderProject({
      name: "aramiko",

            text: "Skala Design"

        { type: "image", span: 12, src: "/assets/aramiko/aramiko.webp", alt: "Aramiko — product hero" },

        { type: "image", span: 6, src: "/assets/aramiko/business-card.png", alt: "Aramiko wordmark" },

        {type: "image", span: 6, src: "/assets/aramiko/bottle.png", alt: "Aramiko website mockup on a monitor" },

      footerLinks: [
        // { label: "About", href: "/#about" },
        { label: "Full portfolio on request", href: "mailto:hello@01studio.com" }
