<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>01 Studio</title>

  <style>
    :root {
      --design-width: 1440;
      --design-height: 1024;
      --module-bg: #f9f9f9;
      --text: #000;
      --duration: 520ms;
      --ease: cubic-bezier(0.76, 0, 0.24, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: var(--text);
    }

    body {
      font-family: "Akkurat Carnault", Arial, sans-serif;
    }

    /* Full-page background image, shown behind everything while a
       project (or a module's default image) is hovered. */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 420ms ease;
      pointer-events: none;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    /* Always remains 1440 × 1024 internally.
       JavaScript scales and centers it without changing its coordinate system. */
    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1440px;
      height: 1024px;
      transform-origin: top left;
    }

    .logo {
      position: absolute;
      left: 713px;
      top: 505px;
      z-index: 10;
      width: 15px;
      margin: 0;
      font-size: 12px;
      line-height: 1;
      font-weight: 400;
      text-align: center;
      pointer-events: none;
    }

    .module {
      position: absolute;
      display: block;
      overflow: hidden;
      padding: 2px;
      border: 0;
      background: var(--module-bg);
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      line-height: 1;
      font-weight: 400;
      text-transform: uppercase;

      transition:
        left var(--duration) var(--ease),
        top var(--duration) var(--ease),
        width var(--duration) var(--ease),
        height var(--duration) var(--ease);
    }

    .module__label {
      position: absolute;
      left: 2px;
      top: 2px;
      width: 33.333%;
      display: block;
      white-space: nowrap;
      pointer-events: none;
      transition: width var(--duration) var(--ease);
    }

    /* text + project index — the "following 2 columns" */
    .module__body {
      position: absolute;
      left: 33.333%;
      top: 2px;
      right: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .module.is-hovered .module__body {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 220ms ease 160ms;
    }

    .module__desc {
      display: block;
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 400;
      text-transform: uppercase;
    }

    .module__projects {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
    }

    .module__projects li + li {
      margin-top: 4px;
    }

    .module__projects a {
      display: block;
      font-size: 12px;
      line-height: 1.4;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 150ms ease;
    }

    .module__projects a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .state-indicator {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 30;
      margin: 0;
      font: 11px/1 Arial, sans-serif;
      color: #777;
      user-select: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .module {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>
  <div class="viewport">
    <main class="stage" id="stage" aria-label="Main navigation">
      <div class="logo" aria-hidden="true">0<br>1</div>
    </main>
  </div>

  <p class="state-indicator" id="stateIndicator" aria-live="polite"></p>

  <script src="./scripts/menu-layouts.js"></script>
  <script src="./scripts/home.js"></script>
</body>
</html>
